[project]
name = "greenwayai"
version = "0.1.0"
description = "Carbon-aware LLM inference gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "tiktoken>=0.8,<1.0",
    "pynvml>=11.5,<12.0",
    "opentelemetry-api>=1.31,<2.0",
    "opentelemetry-sdk>=1.31,<2.0",
    "opentelemetry-exporter-otlp>=1.31,<2.0",
    "sentence-transformers>=5.7,<6.0",
    "torch==2.14.1+cpu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.hatch.build.targets.wheel]
packages = ["ingress", "telemetry", "optimizers", "serving", "carbon", "verify", "shared"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }