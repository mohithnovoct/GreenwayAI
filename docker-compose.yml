services:
  gateway:
    hostname: greenwayai-gateway
    build:
      context: .
      dockerfile: ingress/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GREENWAY_BACKEND_MODE: ${GREENWAY_BACKEND_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GREENWAY_ENERGY_MODE: ${GREENWAY_ENERGY_MODE:-nvml}
      VLLM_BACKEND_URL: ${VLLM_BACKEND_URL:-http://mock-backend:8001}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      PROMPT_OPT_ENABLED: "false"
      PROMPT_OPT_AB_PERCENT: "100"
      PROMPT_OPT_WORD_CAP: ${PROMPT_OPT_WORD_CAP:-150}
      PROMPT_OPT_COMBINE_VARIATIONS: ${PROMPT_OPT_COMBINE_VARIATIONS:-false}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${SEMANTIC_CACHE_SIMILARITY_THRESHOLD:-}
      SEMANTIC_CACHE_EMBED_TIMEOUT_MS: ${SEMANTIC_CACHE_EMBED_TIMEOUT_MS:-100}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_TENANT_NAMESPACE: ${CACHE_TENANT_NAMESPACE:-greenwayai-single-tenant}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_EMBEDDING_MODEL_ID: ${CACHE_EMBEDDING_MODEL_ID:-sentence-transformers/all-MiniLM-L6-v2}
      CACHE_EMBEDDING_MODEL_REVISION: ${CACHE_EMBEDDING_MODEL_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mock-backend:
        condition: service_healthy

  gateway-optimized:
    hostname: greenwayai-gateway
    build:
      context: .
      dockerfile: ingress/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      GREENWAY_BACKEND_MODE: ${GREENWAY_BACKEND_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GREENWAY_ENERGY_MODE: ${GREENWAY_ENERGY_MODE:-nvml}
      VLLM_BACKEND_URL: ${VLLM_BACKEND_URL:-http://mock-backend:8001}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      PROMPT_OPT_ENABLED: "true"
      PROMPT_OPT_AB_PERCENT: "100"
      PROMPT_OPT_WORD_CAP: ${PROMPT_OPT_WORD_CAP:-150}
      PROMPT_OPT_COMBINE_VARIATIONS: ${PROMPT_OPT_COMBINE_VARIATIONS:-false}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${SEMANTIC_CACHE_SIMILARITY_THRESHOLD:-}
      SEMANTIC_CACHE_EMBED_TIMEOUT_MS: ${SEMANTIC_CACHE_EMBED_TIMEOUT_MS:-100}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_TENANT_NAMESPACE: ${CACHE_TENANT_NAMESPACE:-greenwayai-single-tenant}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_EMBEDDING_MODEL_ID: ${CACHE_EMBEDDING_MODEL_ID:-sentence-transformers/all-MiniLM-L6-v2}
      CACHE_EMBEDDING_MODEL_REVISION: ${CACHE_EMBEDDING_MODEL_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      mock-backend:
        condition: service_healthy

  mock-backend:
    build:
      context: .
      dockerfile: ingress/Dockerfile
    command: ["uvicorn", "ingress.mock_backend:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]
    environment:
      GREENWAY_MOCK_ADAPTIVE_RESPONSES: ${GREENWAY_MOCK_ADAPTIVE_RESPONSES:-false}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Private-network only; auth is disabled unless REDIS_ARGS includes --requirepass.
  redis:
    image: redis/redis-stack-server:7.4.0-v2
    expose:
      - "6379"
    environment:
      REDIS_ARGS: ${REDIS_ARGS:---maxmemory 256mb --maxmemory-policy allkeys-lru}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi'
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.133.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

